<!--
  Thymeleaf 등록·수정 화면 예시 (조회 화면은 notice-view.html)
  - 정적 리소스: dist/ 의 파일을 static/js, static/css 에 둔다
      static/js/jm-editor.min.js, static/js/jm-editor.config.js(선택), static/css/jm-editor.css
    CDN 으로 쓰려면 https://cdn.jsdelivr.net/gh/jinix55/JmEditor@v0.0.2/dist/… 로 바꾸면 된다.
  - API 레이어(JmEditorApi) 로 조회/등록/수정/업로드/서식을 처리한다. 서버 참조 구현: server/spring-boot
  - 서버에서는 jsoup 으로 반드시 재 sanitize 할 것 (클라이언트 sanitize 는 UX 용).
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/jm-editor.css}">
</head>
<body>
<form id="noticeForm">
  <input type="text" id="title" name="title" placeholder="제목">

  <!-- 에디터가 그려질 컨테이너 -->
  <div id="editor"></div>

  <button type="submit">저장</button>
</form>

<!-- 설정(업로드 제한 등)은 선택 사항. 쓰면 에디터 스크립트보다 먼저 -->
<script th:src="@{/js/jm-editor.config.js}"></script>
<script th:src="@{/js/jm-editor.min.js}"></script>
<script th:inline="javascript">
  const { JmToolbarEditor } = JmEditor;

  const ctx = /*[[@{/}]]*/ '/';
  const contentId = /*[[${notice?.id}]]*/ null;   // 수정 화면이면 id, 등록 화면이면 null
  const csrfHeader = /*[[${_csrf?.headerName}]]*/ 'X-CSRF-TOKEN';
  const csrfToken  = /*[[${_csrf?.token}]]*/ '';

  const editor = new JmToolbarEditor(document.getElementById('editor'), {
    placeholder: '내용을 입력하세요',
    // 퍼블리싱 구조(class·section 등)를 지켜야 하는 화면이면 켠다 — 서버 application.yml 의 jm-editor.structure 도 같은 값으로
    // structure: { enabled: true, classAllow: ['tit-*', 'box-*'] },
    // API 레이어: 조회/등록/수정/이미지 업로드/서식 목록을 모두 처리
    api: {
      baseUrl: ctx.replace(/\/$/, ''),
      headers: () => (csrfToken ? { [csrfHeader]: csrfToken } : {}),
    },
    contentId, // 있으면 자동 조회
    onLoaded: (rec) => { document.getElementById('title').value = rec.title || ''; },
    onSaved: (rec) => { alert('저장되었습니다 (id=' + rec.id + ')'); },
  });

  // 저장 버튼: 폼 submit 대신 API 호출 (contentId 유무로 등록/수정 자동 분기)
  document.getElementById('noticeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await editor.save({ title: document.getElementById('title').value });
    } catch (err) {
      alert(err.message);
    }
  });

  // 변경 사항이 있을 때 페이지 이탈 경고
  window.addEventListener('beforeunload', (e) => { if (editor.dirty) e.preventDefault(); });
</script>
</body>
</html>
